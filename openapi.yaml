openapi: 3.0.3
info:
  title: Assay API
  version: 1.0.0
  description: >-
    Stellar asset trap scanner API contract. This document is the schema
    source for the surface `assay serve` registers; docs/api.md is the human
    reference for the same endpoints, and docs/api-versioning.md states what
    the route version and `schema_version` promise.
paths:
  /api/v1/scan:
    get:
      summary: Scan an asset
      parameters:
        - name: asset
          in: query
          required: true
          schema:
            type: string
          description: Asset code and issuer (e.g. USDC-GA5Z...)
        - name: holder
          in: query
          required: false
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
          example: GBRPYHIL2CI3FNQ4BXLFMNDLFJUNPU2HY3ZMFSHONUCEOASW7QC7OX2H
          description: >-
            Optional holder account ID (G..., 56 characters). Answers "am I
            exposed?" for that account: the scan reads the holder's trustline
            and adds a "trustline" finding with the trustline's
            is_clawback_enabled and is_authorized flags, adding the
            trustline_clawback_enabled / trustline_deauthorized mechanics when
            set. Severity never changes (it is issuer-level). A holder that does
            not hold the asset, or whose trustline cannot be read, makes the
            report undetermined. An invalid value is a 400 before any fetch; an
            empty value is the same as omitting it. See docs/api.md.
      responses:
        '200':
          description: Successful scan report. May indicate degraded state via header.
          headers:
            X-Assay-Undetermined:
              schema:
                type: string
                enum: ["true"]
              description: Present and set to "true" if the scan was degraded by a source outage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: >-
            Invalid request parameters (including a holder that is not a G...
            account ID), or an asset identifier naming the
            network's native asset (native/XLM), which has no issuer and no
            authorization flags and is therefore never scanned or attested.
        '404':
          description: Asset not found on the ledger.
        '502':
          description: Upstream scan failure.
  /api/v1/history:
    get:
      summary: Read an asset's recorded observations and derived transitions
      description: >-
        Reads what GET /api/v1/scan recorded; it never scans. An asset with no
        observations is a successful empty result with state "missing", never
        a 404.
      parameters:
        - name: asset
          in: query
          required: true
          schema:
            type: string
          description: Asset code and issuer (e.g. USDC-GA5Z...)
      responses:
        '200':
          description: History in time order, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        '400':
          description: Missing or invalid asset, or the network's native asset.
  /api/v1/exposure:
    get:
      summary: List trustlines held by an account with per-asset severity and trustline finding
      description: >-
        Bounded and paginated: one request runs up to `limit` full scans
        (default 10, maximum 50). Results are per asset; there is no
        aggregate portfolio score. Each asset carries its own undetermined
        flag and undetermined_checks.
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
          description: Holder's account address (G...)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
            minimum: 1
          description: Page size; values above the maximum are clamped to it.
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Index of the first trustline to return for the next page.
      responses:
        '200':
          description: One page of per-asset exposure results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exposure'
        '400':
          description: Missing or invalid account, limit, or cursor.
        '404':
          description: Account not found on the ledger.
        '429':
          description: Rate limited. Retry-After header gives seconds to wait.
        '502':
          description: The account's trustline list could not be fetched.
  /metrics:
    get:
      summary: Scan outcome and per-source failure counters
      description: Counters accumulated since process start.
      responses:
        '200':
          description: A snapshot of the counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
  /healthz:
    get:
      summary: Liveness check
      description: Reports only that the process is up; it checks no upstream.
      responses:
        '200':
          description: The process is running.
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /readyz:
    get:
      summary: Per-upstream readiness check
      description: >-
        The HTTP status tracks the body's status: 200 ready; 503 degraded,
        unavailable, or unknown. No failing probe reports ready.
      responses:
        '200':
          description: Every checkable upstream is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Degraded, unavailable, or unknown; see status and upstreams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /:
    get:
      summary: Serve the single-file UI
      responses:
        '200':
          description: The embedded HTML page.
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    Severity:
      type: string
      description: >-
        The severity level name. The order is part of the contract: a level
        never renumbers within a schema version (docs/api-versioning.md).
        "unevaluated" means the issuer flags were never read and is never a
        permissive answer.
      enum: [clear, low, medium, high, critical, unevaluated]
    Accountability:
      type: string
      description: Whether the issuer's advertised home domain publicly claims the asset.
      enum: [unknown, unverified, verified]
    AccountabilityReason:
      type: string
      enum: [fetch_failed, not_claimed, mismatch, no_home_domain]
      description: >-
        Why accountability was not verified: the stellar.toml could not be
        fetched, it was fetched but does not claim the asset, it disagrees with
        the curated directory, or the issuer has no home_domain. Absent when
        the verdict needs no sub-reason (a verified claim).
    Asset:
      type: object
      required: [code, issuer]
      properties:
        code:
          type: string
        issuer:
          type: string
    Evidence:
      type: object
      description: One attributed claim from a named consumed source.
      required: [source, url, claim, retrieved_at, attempted]
      properties:
        source:
          type: string
        url:
          type: string
          description: >-
            The claim's location: the FINAL location after redirects on a
            successful fetch, the requested location on a failed one.
        requested_url:
          type: string
          description: The SEP-1 well-known location derived from home_domain.
        claim:
          type: string
        retrieved_at:
          type: string
          format: date-time
        attempted:
          type: boolean
          description: >-
            True when retrieved_at is the time the fetch was ATTEMPTED rather
            than the time the source answered (the fetch failed).
        refused:
          type: boolean
          description: >-
            True when the failure is a host-policy refusal: the scanner
            declined to make the request at all.
    Finding:
      type: object
      description: One check's verdict over the asset.
      required: [check, title, severity, escalation, undetermined, reasoning, mechanics, evidence]
      properties:
        check:
          type: string
        title:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        escalation:
          type: boolean
          description: True when the severity comes from reputation rather than issuer capability.
        undetermined:
          type: boolean
          description: >-
            True when this check could not reach a conclusion because a source
            it depends on was unreachable — not the same as finding nothing.
        undetermined_by_source:
          type: object
          additionalProperties:
            type: integer
          description: Count of undetermined checks per source name.
        undetermined_rate:
          type: string
          description: '"numerator/denominator" over the checks run for this asset.'
        reasoning:
          type: string
        mechanics:
          type: array
          items:
            type: string
          description: The capability bits this check observed, as names.
        accountability:
          $ref: '#/components/schemas/Accountability'
        accountability_reason:
          $ref: '#/components/schemas/AccountabilityReason'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
    Report:
      type: object
      description: >-
        The scan report, also printed by `assay scan`. `schema_version` is the
        payload contract version, independent of the /api/v1 route version.
      required:
        - schema_version
        - asset
        - severity
        - base_severity
        - escalated
        - accountability
        - state
        - stale
        - undetermined
        - undetermined_checks
        - mechanics
        - findings
        - evidence
        - scanned_at
      properties:
        schema_version:
          type: integer
          description: Version of the report JSON shape; additive changes do not bump it.
        asset:
          $ref: '#/components/schemas/Asset'
        severity:
          $ref: '#/components/schemas/Severity'
        base_severity:
          $ref: '#/components/schemas/Severity'
        escalated:
          type: boolean
          description: True when reputation raised the level above base_severity.
        accountability:
          $ref: '#/components/schemas/Accountability'
        accountability_reason:
          $ref: '#/components/schemas/AccountabilityReason'
        state:
          type: string
          enum: [valid, unknown, stale]
        stale:
          type: boolean
        stale_reason:
          type: string
        undetermined:
          type: boolean
        undetermined_checks:
          type: array
          items:
            type: string
        undetermined_by_source:
          type: object
          additionalProperties:
            type: integer
        undetermined_rate:
          type: string
        network:
          type: string
          description: The Stellar network passphrase the facts were read from.
        checks:
          type: array
          items:
            type: string
          description: The sorted IDs of the checks the engine actually ran.
        scanner_bound:
          type: boolean
          description: True when the report binds attest.ScannerIdentity into its preimage.
        mechanics:
          type: array
          items:
            type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        observation_window_start:
          type: string
          format: date-time
        observation_window_end:
          type: string
          format: date-time
        scanned_at:
          type: string
          format: date-time
    Observation:
      type: object
      description: >-
        One recorded scan, as retained by the history store: the report's
        verdict fields plus the full mechanic bitset.
      required: [asset, at, mechanics, base_severity, severity, accountability, undetermined]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        at:
          type: string
          format: date-time
        mechanics:
          type: integer
          description: The full mechanic bitset the report carried, as a number.
        base_severity:
          $ref: '#/components/schemas/Severity'
        severity:
          $ref: '#/components/schemas/Severity'
        accountability:
          $ref: '#/components/schemas/Accountability'
        undetermined:
          type: boolean
        undetermined_checks:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
    Transition:
      type: object
      description: >-
        The derived difference between two consecutive observations. A state
        other than "valid" means no comparison could be made; it never means
        "no change".
      required:
        - asset
        - from
        - to
        - state
        - added
        - removed
        - added_names
        - removed_names
        - base_before
        - base_after
        - severity_before
        - severity_after
        - attribution
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        from:
          $ref: '#/components/schemas/Observation'
        to:
          $ref: '#/components/schemas/Observation'
        state:
          type: string
          enum: [valid, unknown, missing]
        reason:
          type: string
        added:
          type: integer
          description: Capability bits present in the later observation only.
        removed:
          type: integer
          description: Capability bits present in the earlier observation only.
        added_names:
          type: array
          items:
            type: string
        removed_names:
          type: array
          items:
            type: string
        base_before:
          $ref: '#/components/schemas/Severity'
        base_after:
          $ref: '#/components/schemas/Severity'
        severity_before:
          $ref: '#/components/schemas/Severity'
        severity_after:
          $ref: '#/components/schemas/Severity'
        attribution:
          type: string
          enum: [none, capability, reputation, both]
    History:
      type: object
      description: The body of GET /api/v1/history.
      required: [asset, state, count, observations, transitions, retention]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        state:
          type: string
          description: >-
            The completeness of the history, not of any request. "missing" is
            an explicit empty result, never a 404.
          enum: [valid, unknown, missing]
        reason:
          type: string
          description: Present when state is not valid.
        count:
          type: integer
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/Transition'
        latest_at:
          type: string
          format: date-time
        latest_age_secs:
          type: integer
        retention:
          type: integer
          description: The per-asset observation cap these results were read against.
    Exposure:
      type: object
      description: The body of GET /api/v1/exposure.
      required: [account, total, limit, count, assets]
      properties:
        account:
          type: string
        total:
          type: integer
          description: Credit trustlines on the account (whole listing, not this page).
        limit:
          type: integer
          description: Page size actually applied.
        count:
          type: integer
        next_cursor:
          type: integer
          description: Cursor for the next page; absent on the last page.
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ExposureAsset'
    ExposureAsset:
      type: object
      description: One asset on an exposure page, with its own severity and completeness.
      required: [asset, severity, undetermined, undetermined_checks]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        severity:
          $ref: '#/components/schemas/Severity'
        undetermined:
          type: boolean
        undetermined_checks:
          type: array
          items:
            type: string
        finding:
          $ref: '#/components/schemas/Finding'
        reason:
          type: string
          description: Why this asset's scan failed; present only when finding is absent.
    Readiness:
      type: object
      required: [status, checked_at, age_secs, upstreams]
      properties:
        status:
          type: string
          enum: [ready, degraded, unavailable, unknown]
        reason:
          type: string
          description: Present when status is not ready.
        checked_at:
          type: string
          format: date-time
        age_secs:
          type: integer
        upstreams:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamStatus'
    UpstreamStatus:
      type: object
      required: [name, kind, reachable, probe_url]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [horizon, consumed]
        reachable:
          type: boolean
        probe_error:
          type: string
        probe_url:
          type: string
    Metrics:
      type: object
      description: >-
        Monotonically increasing counters since process start; a consumer
        derives rates from consecutive reads.
      required: [scan_outcomes, source_failures]
      properties:
        scan_outcomes:
          type: object
          additionalProperties:
            type: integer
          description: Count of scans per outcome class (complete, undetermined, not_found, upstream_failure).
        source_failures:
          type: object
          additionalProperties:
            type: integer
          description: Count of scans per upstream source that failed to answer.
